name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Rust version
        run: rustc --version
      - name: Core and controller tests
        run: cargo test --workspace --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  native-data:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Download and verify pinned native compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          Invoke-WebRequest https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-x86_64.zip -OutFile .tools/llvm.zip
          if ((Get-FileHash .tools/llvm.zip -Algorithm SHA256).Hash -ne '1BCF74D06B724AEECAA6412CA85F5B26FB1DA770E7CDCEFA9263C9C5C3AD34B6') { throw 'Compiler digest mismatch' }
          Expand-Archive .tools/llvm.zip .tools
          "$PWD/.tools/llvm-mingw-20260908-ucrt-x86_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Native source
        run: python tools/generate_layout.py
      - name: Build no-entrypoint layout with pinned LLVM
        shell: pwsh
        run: |
          ./tools/build-layout.ps1
      - name: Descriptor and differential checks (no system installation)
        run: python -m unittest discover -s tests -v
      - name: Build embedded prototype and smoke-test read-only status
        run: |
          cargo build --workspace --locked
          ./target/debug/easy-spanish-quotes.exe status
      - name: Catalog size measurement
        run: python tools/measure-catalog.py
